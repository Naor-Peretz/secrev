# Language-agnostic seed patterns. BRIEF_M1.md §6.
#
# These apply to any text: `languages` is omitted, which §4 defines as "applies
# to all text". A pattern here must not assume a syntax.
#
# Every regex is a `|-` block scalar rather than a quoted string. YAML quoting
# and regex escaping fight each other — a single-quoted scalar cannot hold an
# apostrophe without doubling it, and a double-quoted one eats backslashes. The
# block form passes the line through untouched, so what is written here is what
# the engine compiles.
#
# `owasp` is absent from every pattern below, deliberately rather than by
# oversight. §4 says to map to an OWASP Agentic Top 10 (2026) category "where
# one applies" and to "omit rather than force a bad fit". Assigning codes from
# memory would produce exactly the bad fit it warns against, and a wrong
# category is worse than none: it speaks a vocabulary maintainers recognise
# (PRD §2.4) while saying something untrue. Mapping these is a research task
# against the published taxonomy, not a guess made here.
#
# Patterns are questions, not verdicts (FR-3.2). Nothing below concludes
# anything; each one names a region and asks something a reader must answer.

# Bumped from 2026.09.1 in M3.5, when `log.sensitive` gained its `{0,400}`
# bound. FR-4.6 makes `catalog_version` an invalidation trigger, and the rule
# genuinely matches differently on real targets now — a credential keyword more
# than 400 characters into one call is no longer seen. Leaving the version
# unchanged would assert that verifications recorded against the old rule still
# hold, which is the staleness the field exists to prevent. Every record in
# `tests/golden/hits.jsonl` carries this string, so a bump is visible there and
# nowhere else: the candidate ids do not move, because `window_sha256` is over
# window text and takes no account of the catalog.
#
# Bumped again to 2026.09.3 after a second external review measured three more
# patterns quadratic — `net.fetch_exec` here, `exec.shell_true` and
# `path.traversal` in `python.yaml`, plus `deser.unsafe`'s lookahead. All four
# now carry the same `{0,400}` bound, and all four match differently on real
# targets, which FR-4.6 makes an invalidation trigger exactly as before.
#
# Worth recording *why* one bump was not enough. M3.5 fixed the pattern that
# had been demonstrated rather than the shape that caused it, and the C3 timing
# check measured that one pattern with `re.search` — which returns at the first
# match, so it measured a single scan where `sweep.py`'s `finditer` performs
# one per start position. A check built around the example it was written from
# confirms the example.
version: "2026.09.3"

patterns:
  - id: net.bind_all
    layer: [code]
    # The guards around the address are load-bearing: a bare `0\.0\.0\.0`
    # matches inside `10.0.0.0/8`, which is a private network range and not a
    # bind to every interface. Found by writing the negative fixture, which is
    # what §9 requires one for.
    regex: |-
      (?<![\d.])0\.0\.0\.0(?![\d.])|--remote-debugging-port|--inspect(?:-brk)?\b
    precision: medium
    default_severity_hint: medium
    question: >-
      Who can reach this, and is there authentication in front of it? A debug
      port is not a diagnostic convenience — it is an unauthenticated grant of
      everything the process can reach, to anyone who can open a socket to it.
    references: ["CWE-1327", "CWE-306"]

  - id: net.fetch_exec
    layer: [code]
    # `{0,400}` for the reason `log.sensitive` carries below, and this entry
    # exists because that fix was applied to the pattern that was *demonstrated*
    # rather than to the shape. Three more patterns had it, and the review that
    # found them measured what the M3.5 check did not.
    #
    # The M3.5 timing check used `re.search`, which returns at the first match.
    # `sweep.py` uses `finditer` (D-6: two hits on one line stay two hits), so
    # every start position is tried and the real cost is K starts times N
    # characters. Measured under `finditer`: 0.164 s on 20 KB and 0.618 s on
    # 40 KB — 3.8x for 2x the input, which is quadratic.
    #
    # Residue, stated: a pipe more than 400 characters after `curl` is no longer
    # seen. That is a bound on the rule where §5 asks for a bound on the scan,
    # taken deliberately because the alternative is a live hang in a shipped
    # pattern.
    regex: |-
      (?:curl|wget)\b[^|\n]{0,400}\|\s*(?:sudo\s+)?(?:ba|z|da|k)?sh\b|urlretrieve\s*\(
    precision: high
    default_severity_hint: high
    question: >-
      What is the source, is the reference pinned to a digest rather than a
      moving tag, and is integrity verified before the bytes are run? Fetching
      and executing in one step means the thing reviewed and the thing run are
      never the same artifact.
    references: ["CWE-494", "CWE-829"]

  - id: log.sensitive
    layer: [code]
    # The `{0,400}` is load-bearing and was `*` until M3.5, where it was a
    # quadratic hang in the shipped catalog — not in a user-supplied one.
    #
    # The cost is not inner backtracking. `[^)\n]` has no nested quantifier;
    # the blowup is the *outer* scan. `re.search` retries from every position,
    # a line of `print(` repeated offers thousands of matching starts, and `(`
    # is not excluded — so each start consumed to end of line. K starts times N
    # characters is O(N^2). Measured: 185.72 ms on 9,600 bytes, and 11.4 s on
    # 76,800, which extrapolates to roughly 48 minutes on a 1 MB line.
    #
    # Two other fixes were measured and rejected, both because they lose
    # findings rather than time:
    #   * `[^()\n]*` is linear but stops at the first inner `(`, so
    #     `print(sanitize(password))` and every other nested call goes unseen.
    #     All seven fixtures agreed with it, which is why fixtures alone could
    #     not have caught the regression.
    #   * `[^)\n]*+` (possessive) is worse: it never gives back, so it swallows
    #     the keyword it exists to find and misses two shipped positives.
    #
    # Bounding the repetition keeps `(` permitted, so nested calls still match,
    # and caps each start at 400 characters — O(N*400), linear. 400 rather than
    # 120 or 200 because those were measured losing a keyword 150 and 300
    # characters into a call, and this rule is `precision: low` by design with
    # recall that matters (BRIEF_M3.5.md §5).
    #
    # The residue, stated rather than discovered: a credential keyword more
    # than 400 characters into a single call is no longer seen. That is a bound
    # on the rule, where §5 asks for a bound on the scan, and it is taken
    # deliberately because the alternative is a live hang in a shipped pattern.
    regex: |-
      (?:log(?:ger|ging)?\.\w+|print|console\.\w+|echo)\s*[(\s][^)\n]{0,400}\b(?:token|password|passwd|secret|cookie|api[_-]?key|credential|authorization)\b
    flags: [i]
    precision: low
    default_severity_hint: low
    question: >-
      Is the value being written, or only the name? A log line naming a
      credential is harmless; one interpolating it has copied the credential
      into a destination with different retention and different readers.
    references: ["CWE-532"]

  # §6: "the single most important pattern in the catalog for this domain, and
  # the simplest to write — it is a path list. Give it the most fixture
  # coverage."
  #
  # `flags: [i]` is not portability housekeeping. STACK.md §4: macOS is
  # case-insensitive and Linux is not, so `.CLAUDE` and `.claude` are one
  # directory on one platform and two on the other. A case-sensitive rule here
  # would miss on exactly the platform where the write succeeds.
  #
  # The rule matches the path, not a write verb. Enumerating write verbs is a
  # closed-list assumption that `tee`, a heredoc, `sed -i`, `>`, `cp`, `mv` and
  # `python -c` each defeat — the same reasoning STACK.md §8 H-2 applies to the
  # harness guards. Naming the region and asking whether it is a write is what
  # a pattern is for (P4); deciding it is left to review — M4's structural
  # rules do not cover it.
  - id: fs.agent_config_write
    layer: [code]
    regex: |-
      (?:^|[\s"'`(\[/\\=,])(?:\.claude|\.cursor|\.gemini|\.codex|\.aider|\.agents|\.continue|\.git/hooks|\.zshrc|\.bashrc|\.bash_profile|\.profile|LaunchAgents|autostart|\.config/systemd)\b
    flags: [i]
    precision: high
    default_severity_hint: high
    question: >-
      Is this path reachable from input the caller does not control, and is the
      comparison that guards it case-insensitive? Under P7 a write here is code
      execution rather than I/O — the file is loaded by an agent, so writing it
      is indistinguishable from running it. A denylist checking `.claude`
      blocks `.CLAUDE` on Linux and fails to on macOS, and that assumption is
      itself the finding.
    references: ["CWE-732", "CWE-178"]
